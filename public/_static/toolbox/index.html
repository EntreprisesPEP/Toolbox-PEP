<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toolbox PEP</title>
<meta name="theme-color" content="#14213d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg: #10192e;
    --bg-panel: #182238;
    --line: #2c3752;
    --navy: #14213d;
    --brand-red: #c41230;
    --normal: #f0a202;
    --green: #2fa360;
    --text-primary: #e7eaf0;
    --text-dim: #8a93a8;
    --radius: 4px;
  }
  html[data-theme="day"]{
    --bg: #eef1f7;
    --bg-panel: #ffffff;
    --line: #dde1ea;
    --text-primary: #1a2035;
    --text-dim: #6b7488;
  }
  html{transition:background 0.2s ease;}
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--text-primary);
    font-family:Calibri,'Segoe UI',Candara,Optima,Arial,sans-serif;
  }
  .top-bar{ height:4px; background:var(--brand-red); }

  /* LOGIN SCREEN */
  .login-wrap{
    min-height:calc(100vh - 4px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:#10192e;
    overflow:hidden;
  }
  .password-field-wrap{
    position:relative;
    display:block;
    margin-bottom:16px;
  }
  .password-field-wrap input{
    padding-right:40px;
    margin-bottom:0;
  }
  .password-toggle-btn{
    position:absolute;
    right:6px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    cursor:pointer;
    color:#9aa5c0;
    padding:4px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .password-toggle-btn:hover{
    color:#fff;
  }
  .login-card{
    background:#182238;
    border:1px solid #2c3752;
    border-radius:var(--radius);
    padding:32px 28px;
    width:100%;
    max-width:360px;
  }
  .login-logo{
    display:block;
    height:178px;
    width:auto;
    margin:0 auto 18px;
  }
  .login-card h1{
    font-size:20px;
    text-align:center;
    margin:0 0 4px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    color:#e7eaf0;
  }
  .login-card p.sub{
    text-align:center;
    color:#8a93a8;
    font-size:13px;
    margin:0 0 24px;
  }
  .field-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    color:#8a93a8;
    display:block;
    margin-bottom:6px;
  }
  .login-card input{
    width:100%;
    background:#10192e;
    border:1px solid #2c3752;
    color:#e7eaf0;
    padding:10px 12px;
    border-radius:var(--radius);
    font-size:14px;
    margin-bottom:16px;
    font-family:inherit;
  }
  .login-card input:focus{
    outline:2px solid var(--normal);
    outline-offset:1px;
  }
  .login-btn{
    width:100%;
    background:var(--brand-red);
    color:#fff;
    border:none;
    padding:11px;
    border-radius:var(--radius);
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.5px;
    font-size:13px;
    cursor:pointer;
  }
  .login-btn:hover{background:#e0304f;}
  .login-btn:disabled{opacity:0.5;cursor:not-allowed;}
  .login-error{
    background:var(--brand-red);
    color:#fff;
    font-size:12.5px;
    padding:9px 12px;
    border-radius:var(--radius);
    margin-bottom:16px;
    display:none;
  }
  .login-error.show{display:block;}

  /* HUB */
  .hub-wrap{ display:none; max-width:960px; margin:0 auto; padding:28px 20px 60px; }
  .hub-wrap.show{display:block;}
  header.hub-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--navy);
    border-radius:var(--radius);
    padding:18px 22px;
    margin-bottom:28px;
    flex-wrap:wrap;
    gap:14px;
  }
  .hub-brand{ display:flex; align-items:center; gap:12px; }
  .hub-brand img{ height:96px; width:auto; }
  .hub-brand h1{
    font-size:20px;
    margin:0;
    text-transform:uppercase;
    letter-spacing:0.5px;
    color:#fff;
  }
  .hub-brand p{ margin:0; color:#9aa5c0; font-size:12px; }
  .hub-user{ display:flex; align-items:center; gap:12px; }
  .hub-user span{ font-size:12.5px; color:#9aa5c0; }
  .logout-btn{
    background:transparent;
    border:1px solid rgba(255,255,255,0.25);
    color:#e7eaf0;
    padding:7px 14px;
    border-radius:var(--radius);
    font-size:12px;
    cursor:pointer;
  }
  .logout-btn:hover{border-color:#fff;}

  .tile-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
    gap:16px;
  }
  .tile{
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
    text-decoration:none;
    color:var(--text-primary);
    display:flex;
    flex-direction:column;
    gap:8px;
    transition:border-color 0.15s ease, transform 0.1s ease;
    position:relative;
  }
  .tile.available:hover{ border-color:var(--normal); transform:translateY(-2px); }
  .tile.disabled{ opacity:0.55; cursor:default; }
  .tile-icon{ font-size:26px; }
  .app-icon-img{ width:32px; height:32px; display:block; }
  .tile-name{ font-size:16px; font-weight:600; margin:0; }
  .tile-desc{ font-size:12.5px; color:var(--text-dim); margin:0; flex:1; }
  .tile-status{
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    font-weight:600;
    align-self:flex-start;
    padding:3px 9px;
    border-radius:10px;
  }
  .tile-status.live{ background:#2fa36026; color:#2fa360; }
  .tile-status.soon{ background:#8a93a826; color:var(--text-dim); }

  /* VIEW CONTROLS */
  .view-controls{
    display:flex;
    gap:10px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .toggle-group{
    display:flex;
    border:1px solid var(--line);
    border-radius:20px;
    overflow:hidden;
  }
  .toggle-btn{
    background:transparent;
    border:none;
    color:var(--text-dim);
    font-family:inherit;
    font-size:11.5px;
    letter-spacing:0.5px;
    text-transform:uppercase;
    padding:7px 16px;
    cursor:pointer;
  }
  .toggle-btn.active{
    background:var(--brand-red);
    color:#fff;
  }

  /* LIST FORMAT */
  .tile-grid.format-list{
    display:flex;
    flex-direction:column;
    gap:0;
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
  }
  .tile-grid.format-list .tile{
    flex-direction:row;
    align-items:center;
    gap:16px;
    border:none;
    border-bottom:1px solid var(--line);
    border-radius:0;
    padding:18px 22px;
  }
  .tile-grid.format-list .tile:last-child{ border-bottom:none; }
  .tile-grid.format-list .tile:hover{ transform:none; background:var(--bg); }
  .tile-grid.format-list .tile-icon-badge{
    width:38px;height:38px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-size:18px;color:#fff;flex-shrink:0;
    overflow:hidden;
  }
  .tile-grid.format-list .tile-icon-badge.has-image{ width:44px; height:44px; border-radius:0; background:transparent !important; border:none !important; }
  .tile-grid.format-list .tile-icon-badge .app-icon-img{ width:100%; height:100%; }
  .tile-grid.format-list .tile.available .tile-icon-badge{ background:var(--green); }
  .tile-grid.format-list .tile.disabled .tile-icon-badge{ background:var(--bg); border:1px dashed var(--line); color:var(--text-dim); }
  .tile-grid.format-list .tile-body{ flex:1; min-width:0; }
  .tile-grid.format-list .tile-name{ margin-bottom:2px; }
  .tile-grid.format-list .tile-desc{ margin:0; }
  .tile-grid.format-list .tile-status{ flex-shrink:0; align-self:center; }

  /* STICKER FORMAT */
  .tile-grid.format-sticker{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:24px;
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:40px;
  }
  .tile-grid.format-sticker .tile{
    width:170px;
    border-radius:50%;
    aspect-ratio:1;
    align-items:center;
    justify-content:center;
    text-align:center;
    border:4px solid rgba(128,128,128,0.15);
    padding:18px;
    gap:6px;
    background:#ffffff;
    color:var(--navy);
  }
  html[data-theme="day"] .tile-grid.format-sticker .tile{
    background:var(--navy);
    color:#ffffff;
  }
  .tile-grid.format-sticker .tile.disabled{ opacity:0.6; }
  .tile-grid.format-sticker .tile-icon{ font-size:24px; }
  .tile-grid.format-sticker .tile-icon .app-icon-img{ width:88px; height:88px; }
  .tile-grid.format-sticker .tile-name{ font-size:12.5px; }
  .tile-grid.format-sticker .tile-desc{ display:none; }
  .tile-grid.format-sticker .tile-status{ font-size:8.5px; padding:2px 8px; background:rgba(128,128,128,0.2); align-self:center; }
  .tile-grid.format-sticker .tile.available .tile-status{ background:#2fa36026; color:var(--green); }

  /* CONE ICON (placeholder apps) */
  .cone-icon{ width:32px; height:32px; display:block; }
  .tile-grid.format-list .tile-icon-badge .cone-icon{ width:22px; height:22px; }
  .tile-grid.format-sticker .tile-icon .cone-icon{ width:44px; height:44px; }

  /* NOTE BADGE on placeholder tiles */
  .note-dot{
    position:absolute;
    top:8px; right:8px;
    width:9px; height:9px;
    border-radius:50%;
    background:var(--normal);
    box-shadow:0 0 0 2px var(--bg-panel);
  }
  .tile-grid.format-sticker .note-dot{ top:10px; right:14px; }
  .tile.disabled[data-note-index]{ cursor:pointer; }
  .tile.disabled[data-note-index]:hover{ border-color:var(--normal); }

  /* NOTE MODAL */
  .note-modal-overlay{
    display:none;
    position:fixed; inset:0;
    background:rgba(0,0,0,0.55);
    align-items:center; justify-content:center;
    z-index:200;
    padding:20px;
  }
  .note-modal-overlay.show{ display:flex; }
  .note-modal{
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px;
    width:100%;
    max-width:420px;
  }
  .note-modal h3{ margin:0 0 4px; font-size:16px; color:var(--text-primary); }
  .note-modal p.hint{ margin:0 0 14px; font-size:12px; color:var(--text-dim); }
  .note-items{
    max-height:280px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:4px;
    margin-bottom:10px;
  }
  .note-item{
    display:flex;
    align-items:flex-start;
    gap:9px;
    padding:7px 6px;
    border-radius:var(--radius);
  }
  .note-item:hover{ background:var(--bg); }
  .note-item input[type="checkbox"]{
    margin-top:3px;
    width:16px; height:16px;
    accent-color:var(--green);
    cursor:pointer;
    flex-shrink:0;
  }
  .note-item-text{
    flex:1;
    font-size:13.5px;
    color:var(--text-primary);
    word-break:break-word;
    line-height:1.4;
  }
  .note-item.done .note-item-text{
    color:var(--green);
    text-decoration:line-through;
  }
  .note-item-del{
    background:none;
    border:none;
    color:var(--text-dim);
    cursor:pointer;
    font-size:15px;
    line-height:1;
    padding:0 2px;
    flex-shrink:0;
  }
  .note-item-del:hover{ color:var(--brand-red); }
  .note-empty{
    font-size:12.5px;
    color:var(--text-dim);
    padding:8px 6px;
    font-style:italic;
  }
  .note-add-row{
    display:flex;
    gap:8px;
  }
  .note-add-row input{
    flex:1;
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--text-primary);
    border-radius:var(--radius);
    padding:9px 12px;
    font-family:inherit;
    font-size:13.5px;
  }
  .note-add-btn{
    background:var(--brand-red);
    color:#fff;
    border:none;
    border-radius:var(--radius);
    width:38px;
    font-size:19px;
    cursor:pointer;
    flex-shrink:0;
  }
  .note-add-btn:hover{ background:#e0304f; }
  .note-modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:14px;
  }
  .note-btn{
    border:none;
    border-radius:var(--radius);
    padding:8px 16px;
    font-size:12.5px;
    cursor:pointer;
    font-family:inherit;
  }
  .note-btn.save{ background:var(--brand-red); color:#fff; }
  .note-btn.save:hover{ background:#e0304f; }
  .note-btn.close{ background:transparent; border:1px solid var(--line); color:var(--text-primary); }
  .note-btn.close:hover{ border-color:var(--text-dim); }
</style>
</head>

  ...PLACEHOLDER_APPS
];

const OWNER_EMAIL = 'wdubreuil@pep2000.com';
let currentUserEmail = null;

function noteStorageKey(app, index){
  return 'toolbox-note-' + (app.id || app.name || ('idx' + index));
}
function getNoteItems(app, index){
  try {
    const raw = localStorage.getItem(noteStorageKey(app, index));
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  } catch(e){ return []; }
}
function setNoteItems(app, index, items){
  try {
    const key = noteStorageKey(app, index);
    if(items && items.length){ localStorage.setItem(key, JSON.stringify(items)); }
    else { localStorage.removeItem(key); }
  } catch(e){}
}

let currentFormat = localStorage.getItem('toolbox-format') === 'sticker' ? 'sticker' : 'list';
let currentTheme = localStorage.getItem('toolbox-theme') === 'day' ? 'day' : 'night';

function renderTiles(){
  const grid = document.getElementById('tileGrid');
  grid.className = 'tile-grid format-' + currentFormat;
  grid.innerHTML = APPS.map((app, index) => {
    const isLive = app.status === 'live' && app.url;
    const useAltIcon = app.dayStickerIcon && (
      (currentFormat === 'sticker' && currentTheme === 'day') ||
      (currentFormat === 'list' && currentTheme === 'night')
    );
    const displayIcon = (app.nightIcon && currentTheme === 'night')
      ? app.nightIcon
      : (useAltIcon ? app.dayStickerIcon : app.icon);
    const isImgIcon = displayIcon.indexOf('<img') !== -1;
    const statusHtml = isLive
      ? `<span class="tile-status live">Disponible</span>`
      : `<span class="tile-status soon">${app.statusLabel || 'Bientôt'}</span>`;
    const tag = isLive ? 'a' : 'div';
    const hrefAttr = isLive ? `href="${app.url}"` : '';
    const canOwnerEdit = currentUserEmail === OWNER_EMAIL;
    const noteAttr = (!isLive && app.isPlaceholder && canOwnerEdit) ? `data-note-index="${index}"` : '';
    const hasNote = (!isLive && app.isPlaceholder) ? getNoteItems(app, index).length > 0 : false;
    const noteDotHtml = hasNote ? '<span class="note-dot"></span>' : '';
    const tileClass = (isLive ? 'available' : 'disabled') + (isImgIcon ? ' has-img-icon' : '');
    if(currentFormat === 'list'){
      return `
        <${tag} class="tile ${tileClass}" ${hrefAttr} ${noteAttr}>
          <div class="tile-icon-badge${isImgIcon ? ' has-image' : ''}">${displayIcon}</div>
          <div class="tile-body">
            <p class="tile-name">${app.name}</p>
            <p class="tile-desc">${app.desc}</p>
          </div>
          ${statusHtml}
          ${noteDotHtml}
        </${tag}>`;
    }
    return `
      <${tag} class="tile ${tileClass}" ${hrefAttr} ${noteAttr}>
        <div class="tile-icon">${displayIcon}</div>
        <p class="tile-name">${app.name}</p>
        <p class="tile-desc">${app.desc}</p>
        ${statusHtml}
        ${noteDotHtml}
      </${tag}>`;
  }).join('');

  grid.querySelectorAll('[data-note-index]').forEach(el => {
    el.addEventListener('click', () => openNoteModal(parseInt(el.getAttribute('data-note-index'), 10)));
  });
}

let activeNoteIndex = null;

function renderNoteItems(){
  const app = APPS[activeNoteIndex];
  const items = getNoteItems(app, activeNoteIndex);
  const list = document.getElementById('noteItemsList');
  if(!items.length){
    list.innerHTML = '<p class="note-empty">Aucun item pour l\'instant.</p>';
    return;
  }
  list.innerHTML = items.map((item, i) => `
    <div class="note-item${item.done ? ' done' : ''}">
      <input type="checkbox" data-item-index="${i}" ${item.done ? 'checked' : ''}>
      <span class="note-item-text">${item.text.replace(/</g,'&lt;')}</span>
      <button type="button" class="note-item-del" data-del-index="${i}" title="Supprimer">✕</button>
    </div>`).join('');

  list.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.addEventListener('change', () => {
      const idx = parseInt(cb.getAttribute('data-item-index'), 10);
      const app2 = APPS[activeNoteIndex];
      const items2 = getNoteItems(app2, activeNoteIndex);
      items2[idx].done = cb.checked;
      setNoteItems(app2, activeNoteIndex, items2);
      renderNoteItems();
      renderTiles();
    });
  });
  list.querySelectorAll('.note-item-del').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.getAttribute('data-del-index'), 10);
      const app2 = APPS[activeNoteIndex];
      const items2 = getNoteItems(app2, activeNoteIndex);
      items2.splice(idx, 1);
      setNoteItems(app2, activeNoteIndex, items2);
      renderNoteItems();
      renderTiles();
    });
  });
}

function openNoteModal(index){
  activeNoteIndex = index;
  const app = APPS[index];
  document.getElementById('noteModalTitle').textContent = app.name;
  document.getElementById('noteAddInput').value = '';
  renderNoteItems();
  document.getElementById('noteModalOverlay').classList.add('show');
  document.getElementById('noteAddInput').focus();
}
function closeNoteModal(){
  document.getElementById('noteModalOverlay').classList.remove('show');
  activeNoteIndex = null;
  renderTiles();
}
function addNoteItem(){
  if(activeNoteIndex === null) return;
  const input = document.getElementById('noteAddInput');
  const text = input.value.trim();
  if(!text) return;
  const app = APPS[activeNoteIndex];
  const items = getNoteItems(app, activeNoteIndex);
  items.push({ text: text, done: false });
  setNoteItems(app, activeNoteIndex, items);
  input.value = '';
  renderNoteItems();
  renderTiles();
  input.focus();
}
document.getElementById('noteModalClose').addEventListener('click', closeNoteModal);
document.getElementById('noteModalOverlay').addEventListener('click', (e) => {
  if(e.target.id === 'noteModalOverlay') closeNoteModal();
});
document.getElementById('noteAddBtn').addEventListener('click', addNoteItem);
document.getElementById('noteAddInput').addEventListener('keydown', (e) => {
  if(e.key === 'Enter') addNoteItem();
});

function applyTheme(){
  document.documentElement.setAttribute('data-theme', currentTheme);
  document.querySelectorAll('[data-theme-btn]').forEach(btn=>{
    btn.classList.toggle('active', btn.getAttribute('data-theme-btn') === currentTheme);
  });
}
function applyFormat(){
  document.querySelectorAll('[data-format-btn]').forEach(btn=>{
    btn.classList.toggle('active', btn.getAttribute('data-format-btn') === currentFormat);
  });
}
document.querySelectorAll('[data-theme-btn]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    currentTheme = btn.getAttribute('data-theme-btn');
    localStorage.setItem('toolbox-theme', currentTheme);
    applyTheme();
    renderTiles();
  });
});
document.querySelectorAll('[data-format-btn]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    currentFormat = btn.getAttribute('data-format-btn');
    localStorage.setItem('toolbox-format', currentFormat);
    applyFormat();
    renderTiles();
  });
});
applyTheme();
applyFormat();

function showLogin(){
  document.getElementById('loginWrap').style.display = 'flex';
  document.getElementById('hubWrap').classList.remove('show');
}
function showHub(user){
  document.getElementById('loginWrap').style.display = 'none';
  document.getElementById('hubWrap').classList.add('show');
  document.getElementById('userEmailLabel').textContent = user.email;
  currentUserEmail = (user.email || '').toLowerCase();
  renderTiles();
}

function showLoginError(msg){
  const el = document.getElementById('loginError');
  el.textContent = msg;
  el.classList.add('show');
}
function hideLoginError(){
  document.getElementById('loginError').classList.remove('show');
}

document.getElementById('loginBtn').addEventListener('click', async ()=>{
  hideLoginError();
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  if(!email || !password){
    showLoginError('Entre ton courriel et ton mot de passe.');
    return;
  }
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.textContent = 'Connexion...';
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled = false;
  if(error){
    btn.textContent = 'Se connecter';
    showLoginError('Courriel ou mot de passe incorrect.');
    return;
  }
  showHub(data.user);
});

document.getElementById('loginPassword').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') document.getElementById('loginBtn').click();
});

document.getElementById('passwordToggleBtn').addEventListener('click', ()=>{
  const input = document.getElementById('loginPassword');
  const btn = document.getElementById('passwordToggleBtn');
  if(input.type === 'password'){
    input.type = 'text';
    btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a18.5 18.5 0 0 1 4.22-5.06M9.9 4.24A10.94 10.94 0 0 1 12 5c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
    btn.title = 'Cacher le mot de passe';
  } else {
    input.type = 'password';
    btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
    btn.title = 'Afficher le mot de passe';
  }
});

document.getElementById('logoutBtn').addEventListener('click', async ()=>{
  await sb.auth.signOut();
  showLogin();
});

(async function init(){
  const { data } = await sb.auth.getSession();
  if(data.session && data.session.user){
    showHub(data.session.user);
  } else {
    showLogin();
  }
})();
</script>
</body>
</html>
